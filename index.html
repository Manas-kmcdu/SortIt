<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sorted for college clubs</title>
    <meta
      name="description"
      content="Sorted handles merch, events, vendors, permissions and payments for college clubs. Clubs run on passion. We sort the rest."
    />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0C" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Twitter. Replace the domain once the site has one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sorted" />
    <meta property="og:title" content="Sorted. Clubs run on passion. We sort the rest." />
    <meta
      property="og:description"
      content="Merch, event logistics, vendors, permissions and payments for college clubs, in one place."
    />
    <meta property="og:image" content="https://sorted.example/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sorted. Clubs run on passion. We sort the rest." />
    <meta name="twitter:image" content="https://sorted.example/og.png" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before first paint so there is no flash. -->
    <script>
      (function () {
        var t = 'light'
        try {
          var s = localStorage.getItem('sorted-theme')
          if (s === 'dark' || s === 'light') t = s
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
        } catch (e) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
